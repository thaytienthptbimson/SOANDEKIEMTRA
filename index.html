/* fetch qua cầu nối Electron: trả về Response chuẩn (có stream) */
function deskFetch(url,opts){
 return new Promise((resolve,reject)=>{
  const id=uid()+Date.now().toString(36),sig=opts.signal;let ctrl=null,got=false,done=false;
  const stream=new ReadableStream({start(c){ctrl=c},cancel(){if(!done){done=true;DESK.abort(id)}}});
  const fail=err=>{if(done)return;done=true;if(!got)reject(err);else{try{ctrl.error(err)}catch(e){}}};
  const onAbort=()=>{if(!done)DESK.abort(id);fail(abortErr())};
  if(sig){if(sig.aborted)return reject(abortErr());sig.addEventListener('abort',onAbort,{once:true})}
  let body=opts.body;if(body!=null&&typeof body!=='string')body=String(body);
  DESK.request({id,url:String(url),method:String(opts.method||'GET').toUpperCase(),headers:opts.headers||{},body:body==null?null:body},{
   onHead:h=>{got=true;resolve(new Response(NULL_BODY.has(h.status)?null:stream,{status:h.status,statusText:h.statusText||'',headers:h.headers||{}}))},
   onData:u8=>{if(!done){try{ctrl.enqueue(u8)}catch(e){}}},
   onEnd:()=>{if(!done){done=true;try{ctrl.close()}catch(e){}}if(sig)sig.removeEventListener('abort',onAbort)},
   onError:(msg,aborted)=>{if(aborted)fail(abortErr());else fail(new TypeError(msg||'Network error'))}});
 })}
/* fetch “thông minh”: chọn đường mạng, hết giờ chờ, tự thử lại khi lỗi mạng / máy chủ bận */
async function netFetch(url,opts={}){

  if(user&&user.aborted)throw abortErr();
  const c=new AbortController();let timedOut=false;
  if(user)user.addEventListener('abort',()=>c.abort(),{once:true});
  const timer=setTimeout(()=>{timedOut=true;c.abort()},headTimeout);
  try{
   const call=Object.assign({},o,{signal:c.signal});
   const via=nativeMode()?(DESK?'electron':'tauri'):'browser';
   const res=await(via==='electron'?deskFetch(url,call):via==='tauri'?TAURI_FETCH(url,call):fetch(url,call));
   clearTimeout(timer);NET.last={ok:true,at:Date.now(),via,status:res.status};
   if(RETRY_STATUS.has(res.status)&&attempt<maxRetry){
    const ra=Math.min(15,Math.max(0,num(res.headers.get('retry-after'),0)));try{if(res.body)await res.body.cancel()}catch(e){}
    await sleep(ra?ra*1000:1200*(attempt+1));continue}
   return res
  }catch(e){
   clearTimeout(timer);
   if(user&&user.aborted)throw abortErr();
   if(!timedOut&&attempt<maxRetry){await sleep(900*(attempt+1));continue}
   throw netError(e,url,timedOut)}}}

async function callAI({system='',user='',atts=[],maxTokens,label,json=false}){
 const p=CFG.provider,key=(KEYS[p]||'').trim();
 if(!key)throw new Error('Chưa nhập API key '+PROV[p].name+' — vào mục “Cài đặt AI”.');
 const model=(CFG.model[p]||'').trim(),base=(CFG.base[p]||PROV[p].base).replace(/\/+$/,''),mt=maxTokens||num(CFG.maxTokens,16000);
 ABORT=new AbortController();const signal=ABORT.signal;if(label)setBusy(label);
 try{
  if(p==='claude'){
   const content=atts.map(a=>a.kind==='image'?{type:'image',source:{type:'base64',media_type:a.mime,data:a.b64}}:{type:'document',source:{type:'base64',media_type:'application/pdf',data:a.b64}});
   content.push({type:'text',text:user});
   const body={model,max_tokens:mt,system,messages:[{role:'user',content}],stream:true};
   if(CFG.temp!==''&&CFG.temp!=null)body.temperature=num(CFG.temp);
   const res=await netFetch(base+'/v1/messages',{method:'POST',signal,headTimeout:90000,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
   if(!res.ok)throw new Error(await errText(res));
   const rd=res.body.getReader(),dec=new TextDecoder();let buf='',out='',trunc=false;
   for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(!d||d==='[DONE]')continue;
     let ev=null;try{ev=JSON.parse(d)}catch(e){}if(!ev)continue;
     if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){out+=ev.delta.text;if(label&&out.length%200<ev.delta.text.length)setBusy(label+' · '+out.length.toLocaleString('vi-VN')+' ký tự')}
     else if(ev.type==='error')throw new Error((ev.error&&ev.error.message)||'Lỗi từ máy chủ AI');
     else if(ev.type==='message_delta'&&ev.delta&&ev.delta.stop_reason==='max_tokens')trunc=true}}
   if(trunc)throw new Error('Phản hồi bị cắt vì hết giới hạn token. Hãy tăng “Số token tối đa” (Cài đặt AI) hoặc sinh từng phần nhỏ hơn.');
   return out}
  if(p==='openai'){
   const parts=[{type:'text',text:user}];atts.forEach(a=>parts.push(a.kind==='image'?{type:'image_url',image_url:{url:'data:'+a.mime+';base64,'+a.b64}}:{type:'file',file:{filename:a.name,file_data:'data:application/pdf;base64,'+a.b64}}));
   const body={model,max_completion_tokens:mt,messages:[{role:'system',content:system},{role:'user',content:parts}]};
   if(json)body.response_format={type:'json_object'};if(CFG.temp!==''&&CFG.temp!=null)body.temperature=num(CFG.temp);
   const res=await netFetch(base+'/v1/chat/completions',{method:'POST',signal,headTimeout:600000,headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify(body)});
   if(!res.ok)throw new Error(await errText(res));const j=await res.json();const ch=j.choices&&j.choices[0];

   const t=ch&&ch.message&&ch.message.content;if(!t)throw new Error('AI trả về nội dung rỗng.');return t}
  /* gemini */
  const parts=atts.map(a=>({inline_data:{mime_type:a.mime,data:a.b64}}));parts.push({text:user});
  const gc={maxOutputTokens:mt};if(json)gc.responseMimeType='application/json';if(CFG.temp!==''&&CFG.temp!=null)gc.temperature=num(CFG.temp);
  const res=await netFetch(base+'/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',signal,headTimeout:600000,headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts}],generationConfig:gc})});
  if(!res.ok)throw new Error(await errText(res));const j=await res.json();const c=j.candidates&&j.candidates[0];

  const t=c&&c.content&&c.content.parts&&c.content.parts.map(x=>x.text||'').join('');if(!t)throw new Error('AI trả về nội dung rỗng'+(j.promptFeedback?' (bị chặn: '+JSON.stringify(j.promptFeedback)+')':'.'));return t

  if(e.name==='AbortError')throw new Error('Đã hủy.');
  if(e.net)throw e;
  if(e instanceof TypeError)throw netError(e,base);

/* --- đọc JSON từ phản hồi, sửa lỗi dấu \ của LaTeX --- */
const LATEX_BFNRT=/^(?:beta|bar|binom|begin|bmod|boldsymbol|bigcup|bigcap|bigg?|bot|because|bullet|brace|breve|backslash|bf|frac|dfrac|tfrac|forall|flat|frown|fbox|footnotesize|neq|ne|nu|neg|nabla|notin|not|ni|nmid|newline|nolimits|nsubseteq|nleq|ngeq|nless|ngtr|nearrow|nwarrow|ncong|nrightarrow|nparallel|right|rho|rightarrow|rangle|rfloor|rceil|rm|rightleftharpoons|times|text|textbf|textit|textrm|texttt|theta|tan|tanh|to|triangle|tau|top|therefore|tilde|thicksim|tag|tbinom|tiny|thinspace)(?![A-Za-z])/;
function sanitizeJSON(s){let out='',inStr=false;
 for(let i=0;i<s.length;i++){const c=s[i];
  if(!inStr){out+=c;if(c==='"')inStr=true;continue}
  if(c==='"'){out+=c;inStr=false;continue}
  if(c==='\n'){out+='\\n';continue}if(c==='\r')continue;if(c==='\t'){out+='\\t';continue}
  if(c==='\\'){const n=s[i+1];
   if(n==='\\'||n==='"'||n==='/'){out+=c+n;i++;continue}
   if(n==='u'&&/^[0-9a-fA-F]{4}$/.test(s.substr(i+2,4))){out+=c+n;i++;continue}
   if(n&&'bfnrt'.includes(n)){if(LATEX_BFNRT.test(s.slice(i+1))){out+='\\\\';continue}out+=c+n;i++;continue}
   out+='\\\\';continue}
  out+=c}
 return out}
function extractJSON(text){let t=String(text).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
 const a=t.search(/[\[{]/);if(a<0)throw new Error('Không thấy JSON trong phản hồi.');
 const z=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));t=sanitizeJSON(t.slice(a,z+1));
 try{return JSON.parse(t)}catch(e){return JSON.parse(t.replace(/,\s*([}\]])/g,'$1'))}}
async function aiJSON(opts){const raw=await callAI(Object.assign({json:true},opts));
 try{return extractJSON(raw)}catch(e){
  setBusy('Đang sửa lỗi định dạng JSON…');
  const fixed=await callAI({system:'Bạn là bộ sửa JSON. Chỉ xuất JSON hợp lệ, không giải thích.',user:'Sửa đoạn sau thành JSON hợp lệ, giữ nguyên nội dung. Mọi dấu gạch chéo ngược trong công thức LaTeX phải viết gấp đôi (\\\\).\n\n'+raw,json:true,maxTokens:opts.maxTokens});
  return extractJSON(fixed)}}

   Bản .exe có libs/ thì dùng local trước → chạy được cả khi mất mạng; trên web thì local là phương án cuối. */
const LIBS={
 katex:{cdn:['https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js','https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js'],cdn2:['https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js','https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js'],local:['libs/katex/katex.min.js','libs/katex/contrib/auto-render.min.js']},

 pdfjs:{cdn:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'],cdn2:['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'],local:['libs/pdf.min.js']},
 xlsx:{cdn:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'],cdn2:['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],local:['libs/xlsx.full.min.js']},
 lame:{cdn:['https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js'],cdn2:['https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js'],local:['libs/lame.min.js']}};
const PDF_WORKER={cdn:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',cdn2:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',local:'libs/pdf.worker.min.js'};
const LOADED={},LIBSRC={};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('Không tải được thư viện: '+src))};document.head.appendChild(s)})}
function libOrder(n){const o=['cdn','cdn2','local'].filter(k=>LIBS[n][k]);return(DESK&&NET.info&&NET.info.hasLibs)?['local'].concat(o.filter(k=>k!=='local')):o}
async function loadLib(n){
 if(!LOADED[n])LOADED[n]=(async()=>{let last=null;
  for(const k of libOrder(n)){try{for(const s of LIBS[n][k])await loadScript(s);LIBSRC[n]=k;return}catch(e){last=e}}
  throw last||new Error('Không tải được thư viện '+n)})();
 try{await LOADED[n]}catch(e){LOADED[n]=null;throw e}}
async function imgToB64(file,max=1600){const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85).split(',')[1]}
async function ingest(files){const texts=[],atts=[];
 for(const f of files){const ext=(f.name.split('.').pop()||'').toLowerCase();
  try{
   if(['txt','md','csv','tsv','json','html','htm'].includes(ext))texts.push({name:f.name,text:await f.text()});
   else if(ext==='docx'){await loadLib('mammoth');const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});texts.push({name:f.name,text:r.value})}
   else if(ext==='xlsx'||ext==='xls'){await loadLib('xlsx');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});texts.push({name:f.name,text:wb.SheetNames.map(n=>'## '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n')})}
   else if(ext==='pdf'){const buf=await f.arrayBuffer();let t='';
    try{await loadLib('pdfjs');pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER[LIBSRC.pdfjs]||PDF_WORKER.cdn;
     const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n\n'}}catch(e){t=''}
    if(t.replace(/\s/g,'').length>200)texts.push({name:f.name,text:t});
    else{if(buf.byteLength>20*1024*1024)toast('PDF quá lớn (>20MB): '+f.name,'warn');else{atts.push({kind:'pdf',name:f.name,mime:'application/pdf',b64:bufToB64(buf)});toast('PDF dạng ảnh/quét — sẽ gửi trực tiếp cho AI đọc: '+f.name,'info')}}}
   else if(['png','jpg','jpeg','webp','gif'].includes(ext))atts.push({kind:'image',name:f.name,mime:'image/jpeg',b64:await imgToB64(f)});
   else toast('Định dạng chưa hỗ trợ: '+f.name,'warn');
  }catch(e){toast('Không đọc được '+f.name+': '+e.message,'bad')}}
 return{texts,atts}}
async function handleFiles(files,target){if(!files||!files.length)return;showBusy('Đang đọc tệp…');
 try{const r=await ingest(Array.from(files));
  if(target==='mx'){MXI.texts.push(...r.texts);MXI.atts.push(...r.atts)}else{S.texts.push(...r.texts);ATT.push(...r.atts)}
  saveProject();toast('Đã nạp '+(r.texts.length+r.atts.length)+' tệp','ok')}finally{hideBusy();renderView()}}

function planFor(type){const out=[];S.topics.forEach((tp,i)=>{if(tp.audio&&type==='mcq')return;LEVELS.forEach(l=>{const n=cell(tp.id,type,l);if(n>0)out.push({code:'T'+(i+1),tp,l,n})})});return out}
const planText=pl=>pl.map(x=>x.code+' | '+lvName(x.l)+' | '+x.n).join('\n');
function promptFor(type,pl,extraNote){
 const P=S.struct.parts[type];let n=pl.reduce((a,x)=>a+x.n,0),task,schema;
 const lvg='Quy ước: Biết = nhớ/nhận ra/nêu được; Hiểu = giải thích/so sánh/tính toán trực tiếp; Vận dụng = giải quyết tình huống mới/thực tiễn, nhiều bước.';
 if(type==='mcq'){task='Soạn ĐÚNG '+n+' câu trắc nghiệm nhiều lựa chọn (4 phương án A, B, C, D, chỉ 1 đúng). Phân bổ BẮT BUỘC (mã chủ đề | mức độ | số câu):\n'+planText(pl);
  schema='{"questions":[{"topic":"T1","level":"biet|hieu|vd","group":"","context":"","stem":"...","options":["...","...","...","..."],"answer":"A","explanation":"lời giải ngắn gọn","spec":"yêu cầu cần đạt được kiểm tra"}]}\nGhi chú: options KHÔNG kèm tiền tố A./B.; nếu nhiều câu dùng chung một ngữ liệu thì đặt cùng "group" và chỉ ghi "context" ở câu đầu tiên của nhóm.'}
 else if(type==='tf'){const nC=P.count;task='Soạn ĐÚNG '+nC+' câu trắc nghiệm Đúng/Sai. Mỗi câu gồm phần dẫn "stem" (tình huống/ngữ liệu/giả thiết chung, đủ để xét cả 4 ý) và 4 ý a), b), c), d); học sinh xác định từng ý Đúng hay Sai. Các ý tăng dần mức độ (a, b thấp hơn; c, d cao hơn), trộn lẫn đúng và sai, không để cả 4 ý cùng đúng hoặc cùng sai. Tổng '+(nC*4)+' ý, phân bổ tham chiếu (mã chủ đề | mức độ | số Ý):\n'+planText(pl);
  schema='{"questions":[{"topic":"T1","stem":"...","statements":[{"text":"...","truth":true,"level":"biet|hieu|vd"},{"text":"...","truth":false,"level":"hieu"},{"text":"...","truth":true,"level":"hieu"},{"text":"...","truth":false,"level":"vd"}],"explanation":"giải thích từng ý a,b,c,d"}]}'}
 else if(type==='short'){task='Soạn ĐÚNG '+n+' câu trắc nghiệm trả lời ngắn (học sinh tự điền đáp án, không có phương án). Phân bổ BẮT BUỘC (mã chủ đề | mức độ | số câu):\n'+planText(pl);
  schema='{"questions":[{"topic":"T1","level":"biet|hieu|vd","stem":"...","answer":"đáp án duy nhất, ngắn gọn","explanation":"lời giải ngắn gọn"}]}\nĐáp án phải duy nhất và chấm được tự động.'}
 else{task='Soạn ĐÚNG '+n+' câu tự luận, TỔNG điểm '+fmt(P.points)+' (ghi điểm từng câu trong "points", tổng đúng '+fmt(P.points)+'). Phân bổ BẮT BUỘC (mã chủ đề | mức độ | số câu):\n'+planText(pl);
  schema='{"questions":[{"topic":"T1","level":"biet|hieu|vd","group":"","context":"","stem":"...","points":1.0,"answer":"đáp án/hướng dẫn chấm chi tiết","rubric":[{"step":"ý/bước chấm","points":0.25}],"explanation":""}]}\nTổng điểm các bước trong rubric của mỗi câu bằng "points" của câu đó.'}
 const src=sourceBlock();
 return ctxHeader()+'\n\nCÁC CHỦ ĐỀ VÀ YÊU CẦU CẦN ĐẠT (mã chủ đề trong ngoặc vuông):\n'+topicBlock()+'\n\nTÀI LIỆU NGUỒN:\n'+(src||'(không có — dùng kiến thức theo chương trình giáo dục phổ thông 2018)')+'\n\n'+lvg+'\n\nNHIỆM VỤ: '+task+(extraNote?'\n\nYÊU CẦU BỔ SUNG: '+extraNote:'')+'\n\nĐỊNH DẠNG TRẢ VỀ (JSON):\n'+schema}
const stripOpt=s=>String(s==null?'':s).replace(/^\s*(?:\(?[A-Da-d][\.\)])\s+/,'').trim();
function normQ(raw,type,map){const code=c=>map[String(c||'').trim().toUpperCase()]||'';
 const q={id:uid(),type,topic:code(raw.topic||raw.topic_id)||(S.topics[0]&&S.topics[0].id)||'',level:LEVELS.includes(raw.level)?raw.level:'hieu',group:String(raw.group||''),context:String(raw.context||''),stem:String(raw.stem||raw.question||''),explanation:String(raw.explanation||raw.solution||''),spec:String(raw.spec||'')};
 if(type==='mcq'){q.options=(raw.options||raw.choices||[]).slice(0,4).map(stripOpt);while(q.options.length<4)q.options.push('');q.answer=String(raw.answer||'A').trim().toUpperCase().charAt(0);if(!'ABCD'.includes(q.answer))q.answer='A'}
 if(type==='tf'){q.statements=(raw.statements||[]).slice(0,4).map(s=>({text:stripOpt(s.text),truth:s.truth===true||String(s.truth).toLowerCase()==='true'||String(s.truth).toLowerCase()==='đúng',level:LEVELS.includes(s.level)?s.level:q.level,topic:code(s.topic)||q.topic}));while(q.statements.length<4)q.statements.push({text:'',truth:false,level:q.level,topic:q.topic})}
 if(type==='short')q.answer=String(raw.answer==null?'':raw.answer);
 if(type==='essay'){q.points=num(raw.points,0);q.answer=String(raw.answer||'');q.rubricText=(raw.rubric||[]).map(r=>(r.step||r.text||'')+' ('+fmt(num(r.points))+'đ)').join('\n')}
 return q}
function fixGroupContext(qs){const ctx={};qs.forEach(q=>{if(q.group){if(q.context)ctx[q.group]=q.context;else if(ctx[q.group])q.context=ctx[q.group]}})}
function normEssayPoints(qs,total){if(!qs.length)return;let s=sum(qs.map(q=>q.points));if(!(s>0)){qs.forEach(q=>q.points=total/qs.length)}else if(Math.abs(s-total)>0.001){qs.forEach(q=>q.points=q.points*total/s)}
 qs.forEach(q=>q.points=Math.round(q.points*4)/4);const d=r2(total-sum(qs.map(q=>q.points)));qs[qs.length-1].points=r2(qs[qs.length-1].points+d)}
function sortExam(){const ord={mcq:0,tf:1,short:2,essay:3};S.exam.questions=S.exam.questions.map((q,i)=>[q,i]).sort((a,b)=>(ord[a[0].type]-ord[b[0].type])||((a[0].listen?0:1)-(b[0].listen?0:1))||(a[1]-b[1])).map(x=>x[0])}

 if(qs.length!==need)toast('AI trả về '+qs.length+' câu, cần '+need+' ('+TYPE_NAME[type]+'). Kiểm tra ở bảng đối chiếu.','warn',7000);

<script>

const MATH_OPT={delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false};
function renderMath(el){if(!el)return;if(window.renderMathInElement){try{renderMathInElement(el,MATH_OPT)}catch(e){}return}

function fmtInline(s){return esc(s||'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>')}
function fmtText(s){const t=fmtInline(s);const out=[];let tbl=[];
 const flush=()=>{if(tbl.length){const rows=tbl.filter(r=>!/^\|\s*:?-{2,}/.test(r));out.push('<table class="mdt">'+rows.map((r,ri)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>(ri===0?'<th>':'<td>')+c.trim()+(ri===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table>');tbl=[]}};
 for(const ln of t.split('\n')){if(/^\s*\|.*\|\s*$/.test(ln))tbl.push(ln.trim());else{flush();out.push(ln)}}flush();
 return out.join('<br>').replace(/<br>(<table)/g,'$1').replace(/(<\/table>)<br>/g,'$1')}
function mathify(html,mode){if(mode!=='mathml'||!window.katex)return html;
 const dec=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/<br>/g,'\n');
 return html.replace(/\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g,(m,a,b)=>{try{return katex.renderToString(dec(a||b),{output:'mathml',displayMode:!!a,throwOnError:false})}catch(e){return m}})}

const ROMAN=['I','II','III','IV'];
function qNum(qs,q){return qs.filter(x=>x.type===q.type).indexOf(q)+1}
function qHTML(q,n,o={}){

 if(q.type==='mcq'){const L=['A','B','C','D'],ops=q.options.map(fmtInline);const mx=Math.max(...q.options.map(x=>x.replace(/\$[^$]*\$/g,'xxxxxx').length));const cols=mx<=16?4:mx<=42?2:1;
  h+='<table class="opts">';for(let i=0;i<4;i+=cols){h+='<tr>'+L.slice(i,i+cols).map((l,j)=>'<td style="width:'+(100/cols)+'%"><b>'+l+'.</b> '+ops[i+j]+'</td>').join('')+'</tr>'}h+='</table>'}

function examBodyHTML(qs){const types=['mcq','tf','short','essay'].filter(t=>qs.some(q=>q.type===t));let h='';
 types.forEach((t,pi)=>{const list=qs.filter(q=>q.type===t),n=list.length,pts=sum(list.map(q=>qPts(q)));const R=types.length>1?'PHẦN '+ROMAN[pi]+'. ':'';
  const ttl={mcq:'Câu trắc nghiệm nhiều phương án lựa chọn. Thí sinh trả lời từ câu 1 đến câu '+n+'. Mỗi câu hỏi thí sinh chỉ chọn một phương án.',tf:'Câu trắc nghiệm đúng sai. Thí sinh trả lời từ câu 1 đến câu '+n+'. Trong mỗi ý a), b), c), d) ở mỗi câu, thí sinh chọn đúng hoặc sai.',short:'Câu trắc nghiệm trả lời ngắn. Thí sinh trả lời từ câu 1 đến câu '+n+'.',essay:'Tự luận.'}[t];
  h+='<p class="ph">'+R+ttl+' <i>('+fmt(pts)+' điểm)</i></p>';
  let prev=null;list.forEach((q,i)=>{
   if(q.context&&q.context!==prev){let k=i;while(k<list.length&&list[k].context===q.context)k++;const rng=k-i>1?'<p><i>Sử dụng ngữ liệu sau để trả lời câu '+(i+1)+' – '+k+':</i></p>':'';h+=rng+'<div class="ctx">'+fmtText(q.context)+'</div>'}

 +'<table class="hd" style="margin-top:6pt"><tr><td style="text-align:left">Họ và tên: ................................................ Lớp: ........ SBD: ........</td><td style="width:26%;border:1px solid #000"><b>Mã đề: '+v.code+'</b></td></tr></table>'
 +examBodyHTML(v.qs)+'<p class="tc"><b>— HẾT —</b></p><p class="tc sm"><i>Học sinh không được sử dụng tài liệu. Giám thị không giải thích gì thêm. (Tổng điểm: '+fmt(pts)+')</i></p>'}
const KEEP_ORDER=/tất cả|cả\s+[a-d]|đều\s+đúng|đều\s+sai|không\s+có\s+đáp|all of|none of|both/i;
function makeVariant(code,idx){const qs=JSON.parse(JSON.stringify(S.exam.questions));if(idx===0)return{code,qs};
 const rnd=mulberry32(parseInt(hashStr(String(code)+S.info.subject),36)||code),out=[];
 ['mcq','tf','short','essay'].forEach(t=>{let list=qs.filter(q=>q.type===t);
  if(t!=='essay'){const blocks=[];list.forEach(q=>{const last=blocks[blocks.length-1];if(q.context&&last&&last[0].context===q.context&&!q.listen)last.push(q);else if(q.listen&&last&&last[0].listen&&last[0].context===q.context)last.push(q);else blocks.push([q])});
   const lis=blocks.filter(b=>b[0].listen),oth=blocks.filter(b=>!b[0].listen);list=[].concat(...lis,...shuffle(oth,rnd))}
  if(t==='mcq')list.forEach(q=>{if(q.options.some(o=>KEEP_ORDER.test(o)))return;const ord=shuffle([0,1,2,3],rnd),old='ABCD'.indexOf(q.answer);q.options=ord.map(k=>q.options[k]);q.answer='ABCD'[ord.indexOf(old)]});
  out.push(...list)});
 return{code,qs:out}}

function keyDocHTML(vs){const i=S.info;let h='<p class="tc"><b>ĐÁP ÁN VÀ HƯỚNG DẪN CHẤM</b><br><b>ĐỀ KIỂM TRA ĐỊNH KÌ '+esc(i.term.toUpperCase())+' – MÔN '+esc(subjectName().toUpperCase())+' – LỚP '+esc(i.grade)+' – NĂM HỌC '+esc(i.year)+'</b></p>';

 h+='<tr><td></td><td class="l"><b>Tổng số câu</b></td>'+types.map(t=>LEVELS.map(l=>'<td><b>'+colSum(t,l)+'</b></td>').join('')).join('')+'<td></td><td></td></tr>';

function examCheck(){const types=activeTypes(),have={};types.forEach(t=>{have[t]={};S.topics.forEach(tp=>have[t][tp.id]={biet:0,hieu:0,vd:0})});
 S.exam.questions.forEach(q=>{if(!have[q.type])return;if(q.type==='tf')q.statements.forEach(s=>{const id=have.tf[s.topic]?s.topic:q.topic;if(have.tf[id])have.tf[id][s.level]++});else if(have[q.type][q.topic])have[q.type][q.topic][q.level]++});
 let diff=0;types.forEach(t=>S.topics.forEach(tp=>LEVELS.forEach(l=>{if(have[t][tp.id][l]!==cell(tp.id,t,l))diff++})));
 const rows=types.map(t=>{const need=itemTarget(t);const h=sum(S.topics.map(tp=>sum(LEVELS.map(l=>have[t][tp.id][l]))));const qn=S.exam.questions.filter(q=>q.type===t).length;return{t,need,h,qn}});

 if(q.type==='essay')body+='<div class="grid2" style="margin-top:8px"><label class="f">Điểm câu'+inp(b+'.points',{type:'number',dt:'number',attrs:'step="0.25" min="0"'})+'</label></div><label class="f" style="margin-top:8px">Đáp án / hướng dẫn chấm'+ta(b+'.answer',4)+'</label><label class="f" style="margin-top:8px">Biểu điểm chi tiết (mỗi dòng một ý)'+ta(b+'.rubricText',3)+'</label>';

const VOICES={openai:['alloy','ash','ballad','coral','echo','fable','nova','onyx','sage','shimmer','verse'],gemini:['Kore','Puck','Charon','Fenrir','Aoede','Leda','Orus','Zephyr']};
const KIND={dialogue:['Hội thoại 2 người','conversation'],monologue:['Độc thoại / bài nói','talk'],announcement:['Thông báo','announcement'],interview:['Phỏng vấn','interview']};
function parseScript(txt){const segs=[];String(txt||'').split(/\n+/).forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^([^:：]{1,28})[:：]\s*(.+)$/);if(m)segs.push({speaker:m[1].trim(),text:m[2].trim()});else if(segs.length)segs[segs.length-1].text+=' '+l;else segs.push({speaker:'Narrator',text:l})});return segs}
const spkKey=n=>'s'+hashStr(n);
function speakersOf(p){const a=[];parseScript(p.text).forEach(s=>{if(!a.includes(s.speaker))a.push(s.speaker)});return a}
let BVOICES=[];
function initVoices(){if(!window.speechSynthesis)return;const f=()=>{BVOICES=speechSynthesis.getVoices();if(S.tab==='audio'&&!$('#audioBusy')){const s=$$('select[data-voice]');if(s.length&&BVOICES.length&&!s[0].dataset.filled)renderView()}};speechSynthesis.onvoiceschanged=f;BVOICES=speechSynthesis.getVoices()}

function voiceOf(spk,idx){const A=S.audio,p=A.tts;if(spk==='__narr__')return A.narrVoice[p]||(p==='browser'?'':VOICES[p][0]);const v=A.voices[spkKey(spk)]&&A.voices[spkKey(spk)][p];return v||(p==='browser'?'':VOICES[p][(idx+1)%VOICES[p].length])}

function onField(e,kind){const t=e.target,path=t.dataset&&t.dataset.bind;if(!path)return;
 if(t.type==='radio'&&!t.checked)return;
 let v=t.type==='checkbox'?t.checked:t.value;
 if(t.dataset.type==='number')v=t.value===''?0:num(t.value);
 else if(t.dataset.type==='int')v=t.value===''?0:Math.max(0,Math.round(num(t.value)));
 else if(t.dataset.type==='bool')v=t.value==='true';
 setPath(path,v);
 if(path.startsWith('CFG.'))saveCfg();else if(path.startsWith('KEYS.'))saveKeys();else saveProject();
 const m=path.match(/^exam\.questions\.(\d+)\./);if(m)schedPv(+m[1]);
 const rr=t.dataset.rr;if(rr&&HOOKS[rr]&&(kind==='change'||t.dataset.live)){if(t.dataset.live&&kind==='change'&&t.type==='number')return;HOOKS[rr](t)}}
const pvTimers={};function schedPv(i){clearTimeout(pvTimers[i]);pvTimers[i]=setTimeout(()=>{const q=S.exam.questions[i],el=$('#pv'+i);if(q&&el){el.innerHTML=pvHTML(q);renderMath(el)}},350)}
document.addEventListener('input',e=>onField(e,'input'));
document.addEventListener('change',e=>onField(e,'change'));
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const fn=ACT[b.dataset.act];if(!fn)return;e.preventDefault();
 Promise.resolve().then(()=>fn(b.dataset.arg,b,e)).catch(err=>{hideBusy();toast(err&&err.message||String(err),'bad',9000)})});
$('#fileIn').addEventListener('change',async e=>{const t=e.target.dataset.target,f=e.target.files;if(t==='proj'){const file=f[0];if(file){try{const j=JSON.parse(await file.text());S=deepMerge(defaultState(),j);saveProject();renderView();toast('Đã nạp dự án.','ok')}catch(err){toast('Tệp dự án không hợp lệ.','bad')}}}else await handleFiles(f,t);e.target.value=''});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');if(ev==='drop')handleFiles(e.dataTransfer.files,d.dataset.drop)}));

 showBusy('AI đang soạn kịch bản nghe…');
 try{const r=await aiJSON({system:'Bạn là giáo viên ngoại ngữ giàu kinh nghiệm, soạn đề nghe cho học sinh Việt Nam theo Chương trình GDPT 2018. Chính xác, tự nhiên. Chỉ xuất JSON hợp lệ; mọi dấu gạch chéo ngược trong chuỗi JSON phải viết gấp đôi; xuống dòng bằng \\n.',user,label:'AI đang soạn kịch bản nghe…',maxTokens:12000});
  const map=codeMap();(r.passages||[]).forEach((x,i)=>A.passages.push({id:uid(),title:String(x.title||'Bài nghe '+(A.passages.length+1)),kind:KIND[x.kind]?x.kind:A.kind,text:String(x.script||''),questions:(x.questions||[]).map(q=>normQ(q,'mcq',map))}));
  A.sel=Math.max(0,A.passages.length-(r.passages||[]).length);saveProject();hideBusy();renderView();toast('Đã soạn '+(r.passages||[]).length+' bài nghe. Hãy đọc lại kịch bản trước khi tạo file.','ok',6000)}catch(e){hideBusy();throw e}}
function addListenQs(){const A=S.audio,p=A.passages[A.sel];if(!p||!(p.questions||[]).length)return toast('Bài này chưa có câu hỏi.','warn');
 const tid=A.audioTopic&&S.topics.some(t=>t.id===A.audioTopic)?A.audioTopic:(S.topics.find(t=>t.audio)||S.topics[0]).id;
 const en=A.lang.startsWith('en');const ctx=en?'Listen to the recording (Audio '+(A.sel+1)+': '+p.title+') and answer the questions below.':'Nghe bài ghi âm số '+(A.sel+1)+' ('+p.title+') và trả lời các câu hỏi sau.';
 S.exam.questions=S.exam.questions.filter(q=>!(q.listen&&q.audioId===p.id));
 p.questions.forEach(q=>{const c=JSON.parse(JSON.stringify(q));c.id=uid();c.topic=tid;c.listen=true;c.audioId=p.id;c.context=ctx;S.exam.questions.push(c)});
 sortExam();saveProject();toast('Đã thêm '+p.questions.length+' câu hỏi nghe vào đề (mục Soạn đề thi).','ok');renderView()}
let SPEAKING=false;
function previewStop(){SPEAKING=false;if(window.speechSynthesis)speechSynthesis.cancel()}
function previewPlay(){const A=S.audio,p=A.passages[A.sel];if(!p)return;if(!window.speechSynthesis)return toast('Trình duyệt không hỗ trợ đọc văn bản.','bad');
 previewStop();const segs=parseScript(p.text),spk=speakersOf(p);const q=[];
 if(A.narr)q.push({t:fillTpl(A.introTpl,A.sel+1,p.kind),v:'',pause:.8});
 segs.forEach(s=>q.push({t:s.text,v:A.tts==='browser'?voiceOf(s.speaker,spk.indexOf(s.speaker)):'',pause:A.gapSpk}));
 SPEAKING=true;let k=0;const next=()=>{if(!SPEAKING||k>=q.length){SPEAKING=false;return}const it=q[k++],u=new SpeechSynthesisUtterance(it.t);u.lang=A.lang;u.rate=num(A.rate,1);
  const vo=BVOICES.find(v=>v.voiceURI===it.v);if(vo)u.voice=vo;else{const alt=BVOICES.filter(v=>v.lang.toLowerCase().startsWith(A.lang.slice(0,2).toLowerCase()));if(alt.length&&k>0){const idx=Math.max(0,spk.indexOf(segs[k-1-(A.narr?1:0)]&&segs[k-1-(A.narr?1:0)].speaker));u.voice=alt[idx%alt.length]}}
  u.onend=()=>setTimeout(next,it.pause*1000);u.onerror=()=>setTimeout(next,0);speechSynthesis.speak(u)};next()}
function fillTpl(tpl,n,kind){const times={1:'once',2:'twice',3:'three times'}[num(S.audio.repeat,2)]||(S.audio.repeat+' times');return String(tpl).replace(/\{n\}/g,n).replace(/\{kind\}/g,(KIND[kind]||KIND.dialogue)[1]).replace(/\{times\}/g,times)}
/* --- TTS & ghép file --- */
const RATE=24000;let AC=null;const getAC=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function monoOf(ab){const n=ab.length,ch=ab.numberOfChannels,o=new Float32Array(n);for(let c=0;c<ch;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++)o[i]+=d[i]/ch}return o}
function resample(f,from,to){if(from===to)return f;const n=Math.round(f.length*to/from),o=new Float32Array(n),r=from/to;for(let i=0;i<n;i++){const x=i*r,i0=Math.floor(x),i1=Math.min(f.length-1,i0+1),fr=x-i0;o[i]=f[i0]*(1-fr)+f[i1]*fr}return o}
const silence=s=>new Float32Array(Math.round(s*RATE));
function concatF(list){const n=sum(list.map(x=>x.length)),o=new Float32Array(n);let k=0;list.forEach(x=>{o.set(x,k);k+=x.length});return o}
async function ttsOpenAI(text,voice){const A=S.audio,key=KEYS.openai;if(!key)throw new Error('Chưa nhập API key OpenAI (Cài đặt AI).');const model=A.model.openai;
 const body={model,voice,input:text,response_format:'mp3'};if(/gpt-4o/.test(model))body.instructions='Speak clearly and naturally at a moderate pace, like a recording for a language listening test.';else if(num(A.rate,1)!==1)body.speed=clamp(num(A.rate,1),.5,2);
 const res=await netFetch((CFG.base.openai||PROV.openai.base).replace(/\/+$/,'')+'/v1/audio/speech',{method:'POST',signal:ABORT.signal,headers:{'authorization':'Bearer '+key,'content-type':'application/json'},body:JSON.stringify(body)});
 if(!res.ok)throw new Error(await errText(res));const ab=await getAC().decodeAudioData(await res.arrayBuffer());return resample(monoOf(ab),ab.sampleRate,RATE)}
async function ttsGemini(text,voice){const A=S.audio,key=KEYS.gemini;if(!key)throw new Error('Chưa nhập API key Gemini (Cài đặt AI).');
 const res=await netFetch((CFG.base.gemini||PROV.gemini.base).replace(/\/+$/,'')+'/v1beta/models/'+encodeURIComponent(A.model.gemini)+':generateContent?key='+encodeURIComponent(key),{method:'POST',signal:ABORT.signal,headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}})});
 if(!res.ok)throw new Error(await errText(res));const j=await res.json(),part=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts.find(p=>p.inlineData);
 if(!part)throw new Error('Gemini không trả về âm thanh.');const bin=atob(part.inlineData.data),n=bin.length>>1,f=new Float32Array(n);for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;f[i]=v/32768}
 const m=/rate=(\d+)/.exec(part.inlineData.mimeType||'');return resample(f,m?+m[1]:24000,RATE)}
function encodeWAV(f,rate){const n=f.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}return new Blob([buf],{type:'audio/wav'})}
async function encodeAudio(f){if(S.audio.fmt==='mp3'){try{await loadLib('lame');const enc=new lamejs.Mp3Encoder(1,RATE,64),i16=new Int16Array(f.length);for(let i=0;i<f.length;i++){const s=Math.max(-1,Math.min(1,f[i]));i16[i]=s<0?s*0x8000:s*0x7fff}
  const out=[],bs=1152*10;for(let i=0;i<i16.length;i+=bs){const b=enc.encodeBuffer(i16.subarray(i,i+bs));if(b.length)out.push(new Uint8Array(b))}const e=enc.flush();if(e.length)out.push(new Uint8Array(e));return{blob:new Blob(out,{type:'audio/mpeg'}),ext:'mp3'}}catch(e){toast('Không mã hóa được MP3, chuyển sang WAV.','warn')}}
 return{blob:encodeWAV(f,RATE),ext:'wav'}}
async function buildAudio(){const A=S.audio;if(A.tts==='browser')return toast('Hãy chọn OpenAI hoặc Gemini TTS để xuất file.','warn');if(!A.passages.length)return toast('Chưa có bài nghe.','warn');
 showBusy('Đang tạo âm thanh…');const cache={},out=$('#audioOut');if(out)out.innerHTML='<span id="audioBusy"></span>';
 const synth=async(text,voice)=>{const k=A.tts+'|'+voice+'|'+text;if(cache[k])return cache[k];const f=A.tts==='openai'?await ttsOpenAI(text,voice):await ttsGemini(text,voice);cache[k]=f;return f};
 try{const total=sum(A.passages.map(p=>parseScript(p.text).length)),all=[];let done=0;
  for(let pi=0;pi<A.passages.length;pi++){const p=A.passages[pi],segs=parseScript(p.text),spk=speakersOf(p),pieces=[];
   if(A.narr){setBusy('Bài '+(pi+1)+': lời dẫn…');pieces.push(await synth(fillTpl(A.introTpl,pi+1,p.kind),voiceOf('__narr__')),silence(.8))}
   for(let r=1;r<=Math.max(1,num(A.repeat,1));r++){
    if(r>1){pieces.push(silence(1.2));if(A.narr)pieces.push(await synth(A.againTpl,voiceOf('__narr__')),silence(1))}
    for(const s of segs){setBusy('Bài '+(pi+1)+'/'+A.passages.length+' · đang đọc '+(++done)+'/'+(total*Math.max(1,num(A.repeat,1)))+'…');pieces.push(await synth(s.text,voiceOf(s.speaker,spk.indexOf(s.speaker))),silence(num(A.gapSpk,.7)))}}
   if(A.narr)pieces.push(silence(1),await synth(fillTpl(A.endTpl,pi+1,p.kind),voiceOf('__narr__')));
   const f=concatF(pieces);all.push(f,silence(num(A.gapPassage,3)));setBusy('Đang mã hóa bài '+(pi+1)+'…');
   const enc=await encodeAudio(f);addAudioOut('Bài '+(pi+1)+' — '+p.title,enc,'nghe_bai'+(pi+1))}
  if(A.passages.length>1){const enc=await encodeAudio(concatF(all));addAudioOut('Gộp tất cả các bài',enc,'nghe_tat-ca')}
  hideBusy();toast('Đã tạo xong file audio.','ok')}catch(e){hideBusy();throw e}}
function addAudioOut(title,enc,base){const url=URL.createObjectURL(enc.blob),box=$('#audioOut');if(!box)return;const d=document.createElement('div');d.innerHTML='<b>'+esc(title)+'</b> <small class="hint">('+(enc.blob.size/1048576).toFixed(1)+' MB)</small><audio controls src="'+url+'"></audio><a class="btn sm" download="'+base+'_'+subjectName().replace(/[^\wÀ-ỹ]+/g,'-')+'.'+enc.ext+'" href="'+url+'">⬇ Tải '+enc.ext.toUpperCase()+'</a>';box.appendChild(d)}

/* ---------- 14. Khởi động ---------- */
async function init(){applyTheme();try{await initNet()}catch(e){}$('#sideFoot').innerHTML=esc(COPY);$('#foot').innerHTML=esc(COPY)+' · Ứng dụng soạn đề kiểm tra định kì bằng AI';
 if(!S.info.preset&&!presetsFor().length)ensurePresetFits();
 if(location.hash&&VIEWS[location.hash.slice(1)])S.tab=location.hash.slice(1);
 else if(S.tab==='settings'&&KEYS[CFG.provider]&&!LS.get('dgm_project',null))S.tab='info';
 window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(VIEWS[t]&&t!==S.tab){S.tab=t;renderView()}});
 renderView();setTimeout(()=>{loadLib('katex').then(()=>{if(S.tab==='exam'||S.tab==='export')renderMath($('#view'))}).catch(()=>{})},300)}
init();
